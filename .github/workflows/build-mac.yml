name: Build macOS .dmg

# Запускается вручную из вкладки Actions, либо при пуше тега вида v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build .dmg (arm64 + x64)
        run: npm run package:mac
        env:
          # Сборка без подписи Apple Developer (для личного использования).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-trainer-dmg
          path: release/*.dmg
          if-no-files-found: error

      # При пуше тега — публикуем .dmg в GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
